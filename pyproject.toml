[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jinja-script-block"
version = "0.1.0"
description = "Named Python script blocks for Jinja templates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Jinja2>=3.1,<3.2"]
authors = [{name = "Benjamin Jin", email = "jinrudals135@naver.com"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jinja", "jinja2", "template", "script", "python", "extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Framework :: Jinja",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jinrudals/jinja2_script"
Repository = "https://github.com/jinrudals/jinja2_script"
Issues = "https://github.com/jinrudals/jinja2_script/issues"
Changelog = "https://github.com/jinrudals/jinja2_script/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["jinja_script_block*"]

[tool.setuptools.package-data]
jinja_script_block = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
